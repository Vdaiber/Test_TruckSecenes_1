# config/pipeline.yaml

dataset:
  dataroot:         /data
  version:          v1.0-mini
  augment_noise_std: 0.2            # Std für Gaussian-Noise (>0 aktiviert Noise-Stage)
  gt_max_boxes:     null           # null = dynamisch pro Batch

output:
  # Ground‐truth–Visuals (Stage 1)
  ground_truth_dir:      /output/examples_gt

  # Noise‐Visuals (Stage 2)
  noise_comparison_dir:  /output/noise_comparison

  # Tracking (Stage 3)
  tracks_json:           /output/tracks.json

  # Fusion (Stage 4)
  dets_json:             /output/fusion_detections.json
  fused_json:            /output/fused_detections.json
  fusion_dir:            /output/fusion_results
  

  # Fusion‐Vergleichs‐Visuals (Stage 5)
  fusion_comparison_dir: /output/fusion_comparison

visualization:
  scenes:            []            # [] = alle Szenen
  sample_idx:        3            # Sample-Index für Vergleiche
  num_frames:        1             # Head-only per Szene
  history_window:    3             # History‐Fenster (für Tracking-Stage)
  batch_size:        2             # Batch‐Size (für DL‐Tests)
  camera_channel:    CAMERA_LEFT_FRONT

fusion:
  enabled:           true          # Fusion-Stage aktivieren
  iou_threshold:     0.1           # NMS-Schwelle
  score_threshold:   0.5           # (für später, wenn echte Scores kommen)

tracking:
  enabled: true
  use_noisy_gt_as_input: true      #Wenn true, nutzt Stage 3 'dataset.augment_noise_std' für seine GT-Daten
  min_hits_to_report: 3               # bleibt für NMS/Fusion
  temporal:
    max_distance: 5.0
    max_age: 3.0

render:
  line_thickness:    2
  color_mode:        category
  custom_colormap:   null
  z_threshold:       0.1
  box_visibility:    ANY