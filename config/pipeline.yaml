# config/pipeline.yaml

dataset:
  dataroot:         /data
  version:          v1.0-mini
  augment_noise_std: 0.2            # Std für Gaussian-Noise (>0 aktiviert Noise-Stage)
  gt_max_boxes:     null           # null = dynamisch pro Batch

output:
  ground_truth_dir:   /output/examples_gt
  noise_comparison_dir: /output/noise_comparison
  fusion_comparison_dir: /output/fusion_comparison
  fusion_dir:         /output/fusion_results
  dets_json:          /output/fusion_detections.json

visualization:
  scenes:            []            # [] = alle Szenen
  sample_idx:        7             # Sample‐Index für Vergleiche
  num_frames:        1             # Head-only per Szene
  history_window:    3             # History‐Fenster (für Tracking-Stage)
  batch_size:        2             # Batch‐Size (für DL‐Tests)
  camera_channel:    CAMERA_LEFT_FRONT

fusion:
  enabled:           true          # Fusion-Stage aktivieren
  iou_threshold:     0.3           # NMS-Schwelle
  score_threshold:   0.5           # (für später, wenn echte Scores kommen)

tracking:
  enabled:           true          # Tracking-Stage aktivieren
  max_age:           3             # wie lange ein Track „lebt“
  iou_threshold:     0.25          # Matching-Schwelle
  use_velocity:      true          # Forward-Projektion per Geschwindigkeit
  use_camera_motion: true          # Ego-Bewegung berücksichtigen

render:
  line_thickness:    2
  color_mode:        category
  custom_colormap:   null
  z_threshold:       0.1
  box_visibility:    ANY