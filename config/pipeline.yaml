# pipeline.yaml

dataset:
  dataroot: /data
  version:  v1.0-mini
  augment_noise_std: 0.0
  gt_max_boxes: null   # null = dynamisch pro Batch

output:
  ground_truth_dir:  /output/examples_gt
  fusion_dir:        /output/fusion_results
  dets_json:         /output/fusion_detections.json

visualization:
  scenes: []                # [] = alle Szenen
  num_frames: 1
  history_window: 0
  batch_size: 1
  camera_channel: CAMERA_LEFT_FRONT

fusion:
  enabled:        true
  sensor_types:   ['lidar','radar','camera']
  iou_threshold:  0.3
  score_threshold: 0.5
  noise:
    lidar:
      translation_std: 0.0
      rotation_std:    0.0
    radar:
      translation_std: 0.0
      rotation_std:    0.0
    camera:
      translation_std: 0.0
      rotation_std:    0.0

tracking:
  enabled:            true
  max_age:            3
  iou_threshold:      0.25
  use_velocity:       false
  use_camera_motion:  false

render:
  line_thickness:    2
  color_mode:        category   # 'sensor' oder 'category'
  # Pfad zu eigener YAML mit {category_name: [R,G,B]}-Einträgen.
  # null = ausschl. DevKit-Colormap verwenden
  custom_colormap:   null
  z_threshold:       0.1  
  box_visibility: ANY    # ANY | ALL | NONE